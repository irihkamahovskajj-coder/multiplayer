<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Pixel Arena</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1>Pixel Arena</h1>
      <p>Введи имя и играй. Управление работает даже без игрового сервера.</p>

      <input id="nameInput" maxlength="16" placeholder="Твоё имя" autocomplete="off">

      <label class="server-label" for="serverInput">Multiplayer-сервер (необязательно)</label>
      <input id="serverInput" placeholder="https://твой-сервер.onrender.com" autocomplete="url">

      <button id="playButton">Играть</button>
      <div id="status" class="status">Локальный режим готов</div>
    </div>
  </div>

  <div id="hud" class="hud hidden">
    <b>Pixel Arena</b>
    <span id="playerCount">Игроков: 1</span>
    <span id="connection">Локальный режим</span>
  </div>

  <div id="mobileControls" class="mobile-controls hidden">
    <button data-key="w" class="up">▲</button>
    <button data-key="a" class="left">◀</button>
    <button data-key="s" class="down">▼</button>
    <button data-key="d" class="right">▶</button>
  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="./game.js"></script>
</body>
</html>
